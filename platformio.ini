; PlatformIO project config
;
; Layout note: this repo keeps the Arduino IDE structure, so the sketch lives in
; ReflowController/ReflowController.ino and its vendored libraries live in
; ReflowController/src/*. Pointing src_dir at the sketch folder keeps both the
; Arduino IDE and PlatformIO working from the same tree -- the "src/..." include
; paths in the .ino resolve unchanged.
[platformio]
src_dir = ReflowController

[env:esp32dev]
platform = espressif32@6.9.0   ; Arduino core 2.0.17 / IDF 4.4 -- required for esp_adc_cal
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
